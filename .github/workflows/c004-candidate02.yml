name: C004 actual commit hook and conditional margin
on:
  pull_request:
    branches: [main]
    paths: ['c004_commit_candidate_02/**', '.github/workflows/c004-candidate02.yml']
  push:
    branches: [main]
    paths: ['c004_commit_candidate_02/**', '.github/workflows/c004-candidate02.yml']
permissions: {contents: read}
jobs:
  receive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Receive real hook witnesses and conditional arithmetic model
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'mkdir -p candidate-results; git rev-parse HEAD > candidate-results/EXECUTED_COMMIT.txt' EXIT
          python -I -B c004_commit_candidate_02/reproduce.py --out candidate-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: 'c004-candidate02-${{ github.run_id }}', path: candidate-results/, retention-days: 90}
