name: C native execution and atomic permit01
on:
  pull_request:
    branches: [main]
    paths: ['native_execution_01/**', '.github/workflows/native-execution01.yml']
  push:
    branches: [main]
    paths: ['native_execution_01/**', '.github/workflows/native-execution01.yml']
permissions: {contents: read}
jobs:
  qualify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Qualify normal native C effect and durable permit consumption
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install cryptography==50.0.2
          python -I -B native_execution_01/test_contracts.py
          python -O -I -B native_execution_01/test_contracts.py
          python -I -B native_execution_01/reproduce.py --verify-only
          git rev-parse HEAD > EXECUTED_COMMIT.txt
          trap 'sudo -n mkdir -p execution-results; sudo -n cp EXECUTED_COMMIT.txt execution-results/EXECUTED_COMMIT.txt' EXIT
          sudo -n "$(command -v python)" -I -B native_execution_01/reproduce.py --disposable-linux --out "$PWD/execution-results"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: 'native-execution-${{ github.run_id }}', path: execution-results/, retention-days: 90}
